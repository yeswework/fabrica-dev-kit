listen=YES
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
# Docker's default seccomp profile refuses some of the syscalls vsftpd's own sandbox makes
seccomp_sandbox=NO
# passive ports to match `-p` in ftp-servers.js
pasv_enable=YES
pasv_address=127.0.0.1
pasv_min_port=21200
pasv_max_port=21204
